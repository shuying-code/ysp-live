[workspace]
members = [
    "crates/ysp-core",
    "crates/ysp-desktop",
    "crates/ysp-android-jni",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

