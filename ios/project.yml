name: YspLive

options:
  bundleIdPrefix: com.ysp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  YspLive:
    type: application
    platform: iOS
    sources:
      - path: YspLive
        excludes:
          - Info.plist
          - Resources/**
      - path: YspLive/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ysp.live
        PRODUCT_NAME: YspLive
        INFOPLIST_FILE: YspLive/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  YspLive:
    build:
      targets:
        YspLive: all
    run:
      config: Debug
    archive:
      config: Release
