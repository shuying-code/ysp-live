name: 💡 功能建议
description: 提出新功能、平台适配或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议。请说明使用场景和目标平台，便于评估是否适合本项目边界。

  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - Android 手机
        - Android TV
        - iPhone / iPad
        - Windows 桌面原型
        - 全部平台 / 架构
        - 文档 / 构建 / 社区
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / 要解决的问题
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索现有 Issue，未发现相同建议
          required: true
        - label: 该建议不要求绕过 DRM、付费、会员或地区限制
          required: true
