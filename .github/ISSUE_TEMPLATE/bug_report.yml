name: 🐞 Bug / 播放问题
description: 报告可复现的崩溃、黑屏、无法播放、切台或 EPG 问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。播放问题高度依赖设备、系统、WebView、网络和频道，请尽量把信息填完整。

        提交前请先阅读 [使用反馈指南](https://github.com/shuying-code/ysp-live/blob/main/docs/FEEDBACK.md)，并移除完整播放地址、token、Cookie 等敏感信息。

  - type: input
    id: version
    attributes:
      label: 版本 / commit
      description: Release 标签或最新 commit
      placeholder: "v0.1.0 (4a6542d)"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android 手机
        - Android TV
        - iPhone
        - iPad
        - Windows 桌面原型
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备、系统与架构
      placeholder: "Redmi K30S Ultra · Android 12 · arm64 / iPhone Air · iOS 26.4"
    validations:
      required: true

  - type: dropdown
    id: playback_path
    attributes:
      label: 播放路径
      description: 如果不确定，请选择“不确定”
      options:
        - 官方页内播放器
        - Android libmpv 原生播放
        - iOS AVPlayer 原生播放
        - Windows mpv 原型
        - 不确定
    validations:
      required: true

  - type: input
    id: channel
    attributes:
      label: 频道与 PID
      description: 只影响某个频道时必填
      placeholder: "天津卫视 · 600152137"

  - type: input
    id: network
    attributes:
      label: 网络环境
      placeholder: "电信 Wi-Fi，无代理 / 移动网络 / 有线"

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写清楚，说明是否必现
      placeholder: |
        1. 安装 APK 并打开
        2. 默认频道起播后打开频道列表
        3. 切换到 CCTV1
        4. 约 10 秒后黑屏
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附截图、录屏或错误码
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志 / 报错
      description: 不要粘贴完整 .m3u8、token、ysign、Cookie 或 Apple ID
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索现有 Issue，未发现重复问题
          required: true
        - label: 我已移除播放 token、完整 URL、Cookie 等敏感信息
          required: true
        - label: 我理解项目没有内容再分发授权，不能请求绕过 DRM / 付费 / 地区限制
          required: true
