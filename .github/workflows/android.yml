name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "assets/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Download verified native libraries
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/fetch-android-natives.ps1 -Abi arm64-v8a

      - name: Build Rust JNI
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-android-rust.ps1 -Abi arm64-v8a

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug -PyspAbi=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ysp-live-android-arm64-debug
          path: android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
